<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 380px;
            min-height: 300px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
        }
        
        .header {
            background: #16213e;
            padding: 12px 16px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h3 {
            font-size: 14px;
            font-weight: 600;
        }
        
        .badge {
            background: #e94560;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .toolbar {
            padding: 12px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #0f3460;
        }
        
        .toolbar button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        #forceReload {
            background: #0f3460;
            color: #eee;
        }
        
        #forceReload:hover {
            background: #1a4a8a;
        }
        
        #clearVideos {
            background: #2d2d44;
            color: #eee;
        }
        
        #clearVideos:hover {
            background: #3d3d5c;
        }
        
        .video-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 12px;
        }
        
        .video-item {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid #e94560;
        }
        
        .video-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        
        .video-type {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .video-type.direct {
            background: #2e7d32;
            color: white;
        }
        
        .video-type.hls {
            background: #f57c00;
            color: white;
        }
        
        .video-filename {
            font-size: 13px;
            font-weight: 500;
            color: #eee;
            word-break: break-word;
        }
        
        .video-url {
            font-size: 10px;
            color: #888;
            word-break: break-all;
            margin-bottom: 10px;
            font-family: monospace;
        }
        
        .download-btn {
            width: 100%;
            background: #e94560;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .download-btn:hover {
            background: #ff6b6b;
        }
        
        .download-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        
        .empty-state span {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        
        .empty-state p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .empty-state small {
            font-size: 11px;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #16213e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>🎬 Caçador de Vídeos</h3>
        <span class="badge" id="totalCount">0</span>
    </div>
    
    <div class="toolbar">
        <button id="forceReload">🔄 Forçar Detecção</button>
        <button id="clearVideos">🗑️ Limpar Lista</button>
    </div>
    
    <div id="videoList" class="video-list">
        <div class="empty-state">
            <span>🎬</span>
            <p>Nenhum vídeo detectado</p>
            <small>Dê play no vídeo e clique em "Forçar Detecção"</small>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
